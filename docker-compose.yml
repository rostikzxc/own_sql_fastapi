services:

  backend:
    build: .
    container_name: own_fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    container_name: own_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: own_realdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.10.0-alpine
    container_name: own_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  worker:
    build: .
    container_name: own_celery_worker
    command: celery -A app.core.celery.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db

  beat:
    build: .
    container_name: own_celery_beat
    command: celery -A app.core.celery.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
  redis_data: