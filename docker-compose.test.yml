services:

  backend:
    build: .
    container_name: own_fastapi_test
    ports:
      - "8001:8000"
    env_file:
      - .env.test
    environment:
      PYTHONPATH: /app
    depends_on:
      - db


  db:
    image: postgres:17
    container_name: own_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: own_testdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data


volumes:
  postgres_test_data:
